name: Mise à jour des offres
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_offers.py
      - name: Enregistrer si changement
        run: |
          git config user.name "vie-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add offers.json
          git diff --cached --quiet || (git commit -m "Mise à jour des offres" && git push)

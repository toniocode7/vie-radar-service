name: Mise a jour des offres VIE
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_offers.py
      - name: Enregistrer offers.json
        run: |
          git config user.name "vie-radar"
          git config user.email "vie-radar@users.noreply.github.com"
          git add offers.json
          git diff --staged --quiet || git commit -m "Offres du jour"
          git push
